server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name  plateforme.odix.fr www.plateforme.odix.fr;
	  sendfile on;

    default_type application/octet-stream;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE [1-6]\.";
    gzip_min_length   1100;
    gzip_vary         on;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level   9;

    root /usr/share/nginx/html;

	 #HomePage
	  location / {
		try_files $uri $uri/ /index.html = 404;
	 }

    listen 443 ssl; # managed by Certbot

    # RSA certificate
    ssl_certificate /etc/letsencrypt/live/plateforme.odix.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plateforme.odix.fr/privkey.pem; # managed by Certbot

    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot

    # Redirect non-https traffic to https
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    } # managed by Certbot
}
