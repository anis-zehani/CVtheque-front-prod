<div class="mat-liste">
    Opportunités liées ({{Opportunites.selectedOptions.selected.length}}) :
</div>
  
<div style="max-height:250px;overflow-y: auto;">  
    <mat-selection-list #Opportunites (selectionChange)="onSelectionChange($event)" dense>
    
        <mat-list-option *ngFor="let opportunite of listeOpportunites" [selected]="opportunite.selected" [value]="opportunite" checkboxPosition="before">
            {{opportunite.titreOpportunite}}
        </mat-list-option>
    
    </mat-selection-list>
</div>
