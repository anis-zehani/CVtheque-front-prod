<div *ngIf="listeOpportunites.length===0;else SINON_OPPORTUNITES" style="background-color: white;color: #000;">
    - Liste encore vide							
</div>
<ng-template #SINON_OPPORTUNITES>
    <div style="background-color: white;padding-top: 10px;">
        <div style="max-height:200px;overflow-y: auto;">   
            <mat-selection-list dense>
            
            <mat-list-option *ngFor="let opportunite of listeOpportunites">
                {{opportunite.titreOpportunite}}
            </mat-list-option>
            
            </mat-selection-list>
        </div>
    </div>
</ng-template>
