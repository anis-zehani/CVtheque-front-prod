<h2 mat-dialog-title>Modifier le partenaire</h2>

<div>
    <table>
        <tr>
            <td>
                <input matInput [(ngModel)]="data.id" hidden>
                <mat-form-field appearance="outline">
                    <mat-label>Identité du partenaire</mat-label>
                    <input matInput [(ngModel)]="data.identite" required>
                    <mat-icon matSuffix>account_circle</mat-icon>
                </mat-form-field>
            </td>

            <td>
                <!--Photo-->  
                <div fxLayout="row" fxLayoutAlign="space-between center" style="margin-top: -20px"> 
                        <div class="image-upload">
                            <label for="photodeprofilEdit">
                                <mat-icon class="pointer">add_a_photo</mat-icon>
                            </label>
                            <input id="photodeprofilEdit" type="file" style="display: none;" (change)="selectFile($event)">
                        </div>
                        <div class="file-upload" dir="rtl">{{namePhoto}}</div>
                        <label>
                            <div *ngIf="data.urlPhoto; else SINON_PARTENAIRE">
                                <img src="{{storageUrl}}{{data.urlPhoto}}" matTooltip={{data.identite}}>
                            </div>
                            <ng-template #SINON_PARTENAIRE>
                                <img src="/assets/img/partenaire.png" matTooltip={{data.identite}}>
                            </ng-template>
                        </label>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <mat-form-field appearance="outline">
                    <mat-label>Téléphone</mat-label>
                    <input matInput [(ngModel)]="data.telephone">
                    <mat-icon matSuffix>local_phone</mat-icon>
                </mat-form-field>     
            </td>
            <td>
                <mat-form-field appearance="outline">
                    <mat-label>Adresse email</mat-label>
                    <input matInput [(ngModel)]="data.email" required>
                    <mat-icon matSuffix>mail</mat-icon>
                </mat-form-field>
            </td>
        </tr>
        <tr>
            <td>
                <!--Test si Entreprise est définie-->
                <div *ngIf="data.entreprise;else SINON">
                    <app-liste-entreprises 
                        [entrepriseId]="data.entreprise.idEntreprise" 
                        (entrepriseIdEvent)="entrepriseIdEventListner($event)">
                    </app-liste-entreprises>    
                </div>
                <ng-template #SINON>
                    <app-liste-entreprises 
                        (entrepriseIdEvent)="entrepriseIdEventListner($event)">
                    </app-liste-entreprises>    
                </ng-template>
            </td>
            <td>
                <mat-form-field appearance="outline">
                    <mat-label>Poste occupé</mat-label>
                    <input matInput [(ngModel)]="data.posteOccupe">
                    <mat-icon matSuffix>edit</mat-icon>
                </mat-form-field>
            </td>
        </tr>
        <tr>
            <td>
                <mat-form-field appearance="outline">
                    <mat-label>Login</mat-label>
                    <input matInput [(ngModel)]="data.username" required>
                    <mat-icon matSuffix>perm_identity</mat-icon>
                </mat-form-field>     
            </td>
            <td>
                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input matInput [(ngModel)]="data.password" type="password" required>
                    <mat-icon matSuffix>lock</mat-icon>
                </mat-form-field>
            </td>
        </tr>
    </table>

    <mat-form-field appearance="outline" >
        <mat-label>Description détaillée</mat-label>
        <textarea matInput [(ngModel)]="data.descriptionDetaillee" placeholder="Description détaillée" style="height: 80px;overflow-y: auto"></textarea>
        <mat-icon matSuffix>description</mat-icon>
    </mat-form-field>
    

    <div style="display: flex;justify-content: space-between;">
      <button mat-flat-button [mat-dialog-close]="data" (click)="editPhotoController(data.id)" style="margin-right: 10px; width: 30%">Confirmer</button>
      <button mat-stroked-button mat-dialog-close style="margin-left: 10px; width: 30%">Annuler</button>
    </div>
    
</div>
