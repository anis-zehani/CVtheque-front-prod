<h2 mat-dialog-title>Détails du partenaire</h2>

<div  fxLayout
      fxLayout.xs="row"
      fxLayoutAlign="space-between start"
      fxLayoutGap="10px"
      fxLayoutGap.xs="0">
     
<!-- Container : Partie Gauche -->
<div fxFlex="70%"> 
    <table>
        <tr>
            <td>
                <mat-form-field appearance="fill">
                    <mat-label>Identité du partenaire</mat-label>
                    <input matInput [(ngModel)]="data.identite" readonly="true">
                    <mat-icon matSuffix>account_circle</mat-icon>
                </mat-form-field>
            </td>
            <td>
                <!--Photo-->  
                    <div  style="display: flex;justify-content: space-evenly end;">
                        <label>
                            <div *ngIf="data.urlPhoto; else SINON_PARTENAIRE">
                                <img src="{{storageUrl}}{{data.urlPhoto}}" matTooltip={{data.identite}}>
                            </div>
                            <ng-template #SINON_PARTENAIRE>
                                <img src="/assets/img/partenaire.png" matTooltip={{data.identite}}>
                            </ng-template>
                        </label>
                    </div>
            </td>
        </tr>
        <tr>
            <td>
                <mat-form-field appearance="fill">
                    <mat-label>Téléphone</mat-label>
                    <input matInput [(ngModel)]="data.telephone" readonly="true">
                    <mat-icon matSuffix>local_phone</mat-icon>
                </mat-form-field>     
            </td>
            <td>
                <mat-form-field appearance="fill">
                    <mat-label>Adresse email</mat-label>
                    <input matInput [(ngModel)]="data.email" readonly="true">
                    <mat-icon matSuffix>mail</mat-icon>
                </mat-form-field>
            </td>
        </tr>
        <tr>
            <td>
                <!--Test si Entreprise est définie-->
                <div *ngIf="data.entreprise;else SINON">
                    <mat-form-field appearance="fill">
                        <mat-label>Entreprise actuelle</mat-label>
                        <input matInput [(ngModel)]="data.entreprise.nomEntreprise" readonly="true">
                    </mat-form-field>        
                </div>
                <ng-template #SINON>
                    <mat-form-field appearance="fill">
                        <mat-label>Entreprise</mat-label>
                        <input matInput readonly="true">
                    </mat-form-field>  
                </ng-template>    
                
            </td>
            <td> 
                <mat-form-field appearance="fill">
                    <mat-label>Poste occupé</mat-label>
                    <input matInput [(ngModel)]="data.posteOccupe" readonly="true">
                    <mat-icon matSuffix>edit</mat-icon>
                </mat-form-field>
            </td>
        </tr>
        <tr>
            <td>
                <mat-form-field appearance="fill">
                    <mat-label>Login</mat-label>
                    <input matInput [(ngModel)]="data.login" readonly="true">
                    <mat-icon matSuffix>perm_identity</mat-icon>
                </mat-form-field>     
            </td>
            <td>
                <mat-form-field appearance="fill">
                    <mat-label>Password</mat-label>
                    <input matInput [(ngModel)]="data.password" readonly="true">
                    <mat-icon matSuffix>lock</mat-icon>
                </mat-form-field>
            </td>
        </tr>
    </table>

    <mat-form-field appearance="fill" >
        <mat-label>Description détaillée</mat-label>
        <textarea matInput [(ngModel)]="data.descriptionDetaillee" readonly="true" style="height: 80px;overflow-y: auto"></textarea>
        <mat-icon matSuffix>description</mat-icon>
    </mat-form-field>

    <button mat-flat-button mat-dialog-close style="width: 30%">Quitter</button>
</div>

<!-- Container : Partie Droite -->
<div fxFlex="30%">
        <table>
                <tr>
                    <!-- Liste Opportunités liées à ce partenaire --> 
                    <app-liste-opportunites-for-show [idPartenaire]=data.id></app-liste-opportunites-for-show>
                  </tr>
        </table>
</div>
    
</div>
