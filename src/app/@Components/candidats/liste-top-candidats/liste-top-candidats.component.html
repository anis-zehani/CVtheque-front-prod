<div *ngIf="listeCandidatsFavoris.length===0;else SINON_TOP_CANDIDATS" style="background-color: white;color: #000;">
    - Liste encore vide							
</div>
<ng-template #SINON_TOP_CANDIDATS>
    <div style="background-color: white;padding-top: 10px;">
        <div style="max-height:200px;overflow-y: auto;">   
            <mat-selection-list dense>
            
            <mat-list-option *ngFor="let candidatFavoris of listeCandidatsFavoris">
                {{candidatFavoris.identiteCandidat}}
            </mat-list-option>
            
            </mat-selection-list>
        </div>
    </div>
</ng-template>
