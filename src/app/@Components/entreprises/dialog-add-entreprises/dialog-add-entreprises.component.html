<form [formGroup]="formEntreprise" (ngSubmit)="addEntrepriseController()">

  <mat-form-field appearance="outline">
      <mat-label>Nom de l'entreprise</mat-label>
      <input matInput formControlName="nomEntreprise" required>
      <mat-icon matSuffix>add_circle</mat-icon>
  </mat-form-field>

  <mat-form-field appearance="outline" >
      <mat-label>Description de l'entreprise</mat-label>
      <textarea matInput formControlName="descriptionDetaillee" rows="8"></textarea>
      <mat-icon matSuffix>description</mat-icon>
  </mat-form-field>
  
  
  <mat-dialog-actions style="display: flex;justify-content: end;">
      <button mat-flat-button [disabled]="!formEntreprise.valid" (click)="save()">Ajouter une entreprise</button>
      <button mat-stroked-button mat-dialog-close style="margin-top: 10px;">Tout réinitialiser</button>
  </mat-dialog-actions>
</form>
