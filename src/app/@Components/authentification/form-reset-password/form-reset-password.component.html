<div fxLayout="row" fxLayoutAlign="space-between stretch" >

    <div fxflex="30%"></div>

    <div fxflex="40%">
        <div class="title-xs-higher" style="text-align: center">
            Réinitialisation du mot de passe
        </div>
        <form [formGroup]="formResetPassword" (ngSubmit)="resetPassword()">
        <div>

            <mat-form-field appearance="outline" >
                <mat-label>Adresse email</mat-label>
                <input matInput formControlName="email" readonly>
                <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" >
                <mat-label>Nouveau mot de passe</mat-label>
                <input matInput formControlName="password" type="password" required>
                <mat-icon matSuffix>vpn_key</mat-icon>
            </mat-form-field>
            
            <div fxLayout="column" fxLayoutAlign="start space-between stretch" >
                <button mat-flat-button type="submit">Confirmer</button>
                <button mat-stroked-button mat-dialog-close style="margin-top: 10px">Annuler</button>
            </div>
        </div>
        </form> 
    </div>
    <div fxflex="30%"></div>

</div>
