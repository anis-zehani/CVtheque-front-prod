<form [formGroup]="formAuthentification" (ngSubmit)="checkLogin()">

    <div style="text-align: center; margin-bottom: 20px; margin-top: 20px">
        <img src="assets/img/odix.png" style="height: 75px; width:300px">
    </div>

    <div class="title-xs-higher" style="text-align: center; font-weight: 500;margin-bottom: 20px;">
          Accèder à la plateforme
    </div>

    <mat-form-field appearance="outline">
            <mat-label>Nom d'utilisateur</mat-label>
            <input matInput formControlName="username">
            <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

    <mat-form-field appearance="outline">
            <mat-label>Mot de passe</mat-label>
            <input matInput formControlName="password" type="password">
            <mat-icon matSuffix>fingerprint</mat-icon>
    </mat-form-field>
  
    <div fxLayout="row" fxLayoutAlign="space-between stretch" fxHide.lt-md="true"> 
        <button mat-flat-button>Se connecter</button> 
        <div style="width: 150px;"></div>
        <button mat-stroked-button type="button" (click)="openDialogRecupererPassword()">Mot de passe oublié ?</button>
    </div>

    <!-- Visible sur Petits écrans seulement -->
    <div fxLayout="column" fxLayoutAlign="start center" fxHide.gt-sm="true" > 
        <button mat-flat-button style="margin-bottom: 20px;">Se connecter</button> 
        <button mat-stroked-button type="button" style="margin-bottom: 20px" (click)="openDialogRecupererPassword()">Mot de passe oublié ?</button>
    </div>
    
</form>
