<div class="title-xs-higher" style="text-align: center">
        Demande de création d'un compte recruteur
</div>
<form [formGroup]="formAddPartenaireHomePage" (ngSubmit)="addPartenaireTemporaire()">
    <table>
        <tr>
            <td>
                <mat-form-field appearance="outline" >
                    <mat-label>Identité (nom et prénom)</mat-label>
                    <input matInput formControlName="identite" required readonly={{invalidate}}>
                    <mat-icon matSuffix>account_circle</mat-icon>
                </mat-form-field>
            </td>
            <td>
                <mat-form-field appearance="outline" >
                    <mat-label>Téléphone</mat-label>
                    <input matInput formControlName="telephone" required readonly={{invalidate}}>
                    <mat-icon matSuffix>local_phone</mat-icon>
                </mat-form-field>
            </td>
        </tr>
        <tr>
            <td>
                <mat-form-field appearance="outline" >
                    <mat-label>Adresse email</mat-label>
                    <input matInput formControlName="email" required (focusout)="checkIfUserPartenaireEmailExists()">
                    <mat-icon matSuffix>email</mat-icon>
                </mat-form-field>
            </td>
            <td>
                <mat-form-field appearance="outline" >
                     <mat-label>Mot de passe</mat-label>
                     <input matInput formControlName="password" type="password" required readonly={{invalidate}}>
                     <mat-icon matSuffix>vpn_key</mat-icon>
                </mat-form-field>
            </td>
        </tr>
        <tr *ngIf="invalidate" >
            <td style="width: 100%;">
                <div class="text-small-validation-rouge">
                        Cette adresse email existe dèja, veuillez vous connecter.
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <mat-form-field appearance="outline" >
                      <mat-label>Entreprise</mat-label>
                      <input matInput formControlName="entreprise" required readonly={{invalidate}}>
                </mat-form-field>
            </td>
            <td>
                <mat-form-field appearance="outline" >
                       <mat-label>Poste occupé</mat-label>
                       <input matInput formControlName="posteOccupe" required readonly={{invalidate}}>
                </mat-form-field>
            </td>
        </tr>
    </table>
    <mat-form-field appearance="outline" >
            <mat-label>Autres détails</mat-label>
            <textarea matInput formControlName="descriptionDetaillee" style="height: 80px;overflow-y: auto"></textarea>
            <mat-icon matSuffix>description</mat-icon>
    </mat-form-field>

    <div fxLayout="row" fxLayoutAlign="space-between stretch" >
        <button mat-flat-button type="submit" [disabled]="!formAddPartenaireHomePage.valid || invalidate" style="width:40%">Envoyer la demande</button>
        <button mat-stroked-button mat-dialog-close style="width:40%">Annuler</button>
    </div>
</form>
