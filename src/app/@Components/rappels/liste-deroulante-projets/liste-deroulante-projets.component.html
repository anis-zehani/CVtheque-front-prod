<mat-form-field appearance="outline">
    <mat-label>Projet</mat-label>
    <mat-select [(value)]="projetId" (selectionChange)="projetIdEventFunction(projetId)">
      
      <mat-option *ngFor="let projet of projets" [value]="projet.id">{{projet.nomProjet}}</mat-option>
      <mat-option><button mat-flat-button (click)="openDialog()">Ajouter un projet</button></mat-option>
  
    </mat-select>
    <mat-icon matSuffix>business</mat-icon>
</mat-form-field>
