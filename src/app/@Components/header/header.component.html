<div style="height: 45px;border-bottom: 1px solid white;" *ngIf="role==='ROLE_ADMINISTRATEUR'">
    <mat-toolbar style="height: 45px" class="header-devops" fxLayout="row" fxLayoutAlign="space-around center"> 
      <a href="http://dashboard.k8s.odix.fr:8001/api/v1/namespaces/kube-system/services/https:kubernetes-dashboard:/proxy/#/overview?namespace=default" target="_blank" mat-button>Kubernetes</a>
      <a href="http://erp.grafana.k8s.odix.fr/" target="_blank" mat-button>Grafana</a>
      <a href="http://zipkin.odix.fr:30011/zipkin/" target="_blank" mat-button>Zipkin</a>
      <a href="http://graylog.k8s.odix.fr:9000/" target="_blank" mat-button>Graylog</a>
      <a href="http://jenkins.gcp.odix.fr:8080/" target="_blank" mat-button>Jenkins</a>
      <a href="http://kafka.odix.fr:30090/" target="_blank" mat-button>Kafka</a>
      <a href="http://express.odix.fr:30081/" target="_blank" mat-button>Express</a>
      <a href="http://erp.argocd.k8s.odix.fr:30020/" target="_blank" mat-button>ArgoCD</a>
    </mat-toolbar>
</div>

<div class="header" style="height: 45px;border-bottom: 1px solid white;">
  
  <div  fxLayout 
      fxLayout.xs="row" 
      fxLayoutAlign="space-evenly center"
      fxLayoutGap="20px"
      fxLayoutGap.xs="20px">

      <div fxFlex="15%" fxHide.lt-md="true" matTooltip="Accueil">
          <a routerLink="accueil"><img src="assets/img/logo.png" class="logo"></a>
      </div>

      <div fxFlex="5%" fxHide.gt-sm="true" matTooltip="Accueil">
          <a routerLink="accueil"><mat-icon style="color:#fff">home</mat-icon></a>
      </div>
      
      <!-- Visible sur BIG SCREENS -->
      <div fxFlex="65%" fxShow="true" fxHide.lt-md="true">
        <mat-toolbar style="height: 45px"> 
              <a routerLink="accueil" routerLinkActive="active" mat-button>Accueil</a>
              <a routerLink="rappels" routerLinkActive="active" mat-button>Rappels</a>
              <a routerLink="candidats" routerLinkActive="active" mat-button *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Candidats</a>
              <a routerLink="opportunites" routerLinkActive="active" mat-button *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Opportunités</a>
              <a routerLink="partenaires" routerLinkActive="active" mat-button *ngIf="role === 'ROLE_ADMINISTRATEUR'">Partenaires</a>
              <a routerLink="contacts" routerLinkActive="active" mat-button>Contacts</a>
              <a mat-button [matMenuTriggerFor]="menu4" *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'"><mat-icon>menu</mat-icon></a>
              <mat-menu #menu4="matMenu">
                <button mat-menu-item routerLink="technologies" *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Technologies</button>
                <button mat-menu-item routerLink="entreprises" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Entreprises</button>
                <button mat-menu-item routerLink="ecoles" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Écoles</button>
                <button mat-menu-item routerLink="certifications" *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Certifications</button>
                <button mat-menu-item routerLink="collaborateurs" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Collaborateurs</button>
                <button mat-menu-item routerLink="fichiers" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Gestion des fichiers</button>
              </mat-menu>
        </mat-toolbar>
      </div>
      <!--NOTIFICATIONS-->
      <div fxFlex="5%">
          <app-menu-notifications></app-menu-notifications>
      </div>
      
      <div fxFlex="5%" fxHide.lt-md="true">
          <a class="pointer" [matMenuTriggerFor]="menu5" matTooltip="Vous">
            <mat-icon style="color:#f7c341">account_circle</mat-icon> 
            <mat-icon style="color:#f7c341">arrow_drop_down</mat-icon>
          </a>
          <mat-menu #menu5="matMenu">
            <div style="width: 300px;">
              <button mat-menu-item routerLink="account">Gérer mon compte</button>
              <mat-divider></mat-divider>
              <button mat-menu-item routerLink="demandes-adhesion" 
                  *ngIf="role === 'ROLE_ADMINISTRATEUR'">Demandes d'adhésion
              </button>
              <mat-divider></mat-divider>
              <app-logout></app-logout>
            </div>
          </mat-menu>
          
      </div>

      <div fxFlex="10%" class="liste-small" fxHide.lt-md="true">
          <b>{{identite | titlecase}}</b>
      </div>

      <!-- Visible sur SMALL SCREENS -->
      <div fxHide.gt-sm="true" >
          <a class="pointer" [matMenuTriggerFor]="menu5" matTooltip="Vous">
            <mat-icon style="color:#f7c341">account_circle</mat-icon> 
            <mat-icon style="color:#f7c341">arrow_drop_down</mat-icon>
          </a>
          <mat-menu #menu5="matMenu">
              <button mat-menu-item routerLink="account">Gérer mon compte</button>
              <mat-divider></mat-divider>
              <button mat-menu-item routerLink="demandes-adhesion" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Demandes d'adhésion</button>
              <mat-divider></mat-divider>
              <app-logout></app-logout>
          </mat-menu>
      </div>
      <div class="liste-small" fxHide.gt-sm="true">
          <b>{{identite | titlecase}}</b>
      </div>
      <div fxShow="true" fxHide.gt-sm="true" fxFlex="10%">
          <button mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Navigation">
            <mat-icon style="color: #fff !important">more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" xPosition="before">
              <button mat-menu-item routerLink="accueil">Accueil</button>
              <button mat-menu-item routerLink="rappels">Rappels</button>
              <button mat-menu-item routerLink="candidats" *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Candidats</button>
              <button mat-menu-item routerLink="opportunites" *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Opportunités</button>
              <button mat-menu-item routerLink="partenaires" *ngIf="role === 'ROLE_ADMINISTRATEUR' ">Partenaires</button>
              <button mat-menu-item routerLink="contacts">Contacts</button>
              <button mat-menu-item routerLink="technologies" *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Technologies</button>
              <button mat-menu-item routerLink="entreprises" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Entreprises</button>
              <button mat-menu-item routerLink="ecoles" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Écoles</button>
              <button mat-menu-item routerLink="certifications" *ngIf="role === 'ROLE_ADMINISTRATEUR' || role === 'ROLE_PARTENAIRE'">Certifications</button>
              <button mat-menu-item routerLink="collaborateurs" *ngIf="role === 'ROLE_ADMINISTRATEUR' ">Collaborateurs</button>
              <button mat-menu-item routerLink="fichiers" *ngIf="role === 'ROLE_ADMINISTRATEUR'">Gestion des fichiers</button>
          </mat-menu>
      </div>

  </div>
</div>
