<div class="header" style="height: 45px;border-bottom: 1px solid white;">
  
  <div  fxLayout 
      fxLayout.xs="row" 
      fxLayoutAlign="space-evenly center"
      fxLayoutGap="20px"
      fxLayoutGap.xs="20px">

      <div fxFlex="25%">
          <a routerLink="accueil"><img src="assets/img/logo.png" class="logo"></a>
      </div>
      
      <div fxFlex="50%" fxShow="true" fxHide.lt-md="true">
        <!-- The following menu items will be hidden on both SM and XS screen sizes -->
        <mat-toolbar style="height: 45px"> 
              <a routerLink="accueil" mat-button>Accueil</a>
              <a routerLink="rappels" mat-button>Rappels</a>
              <a routerLink="candidats" mat-button>Candidats</a>
              <a routerLink="opportunites" mat-button>Opportunités</a>
              <a routerLink="partenaires" mat-button>Partenaires</a>
              <a routerLink="contacts" mat-button>Contacts</a>
              <a mat-button [matMenuTriggerFor]="menu4"><mat-icon>menu</mat-icon></a>
              <mat-menu #menu4="matMenu">
                <button mat-menu-item routerLink="technologies">Technologies</button>
                <button mat-menu-item routerLink="entreprises">Entreprises</button>
                <button mat-menu-item routerLink="ecoles">Écoles</button>
                <button mat-menu-item routerLink="certifications">Certifications</button>
                <button mat-menu-item routerLink="collaborateurs">Collaborateurs</button>
              </mat-menu>
        </mat-toolbar>
      </div>

      <div fxFlex="15%">
        
      </div>
      <div fxFlex="5%">
        <mat-icon matBadge="5" matBadgeColor="warn" style="color: white">notifications_active</mat-icon>
      </div>
      <div fxFlex="5%">
        <mat-icon style="color: white">account_circle</mat-icon>
      </div>
      <!-- End of hidden on both SM and XS screen sizes -->

      <div fxShow="true" fxHide.gt-sm="true" fxFlex="10%">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon style="color: #fff !important">more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu" xPosition="before">
              <button mat-menu-item routerLink="accueil">Accueil</button>
              <button mat-menu-item routerLink="rappels">Rappels</button>
              <button mat-menu-item routerLink="candidats">Candidats</button>
              <button mat-menu-item routerLink="opportunites">Opportunités</button>
              <button mat-menu-item routerLink="partenaires">Partenaires</button>
              <button mat-menu-item routerLink="contacts">Contacts</button>

              <button mat-menu-item routerLink="technologies">Technologies</button>
              <button mat-menu-item routerLink="entreprises">Entreprises</button>
              <button mat-menu-item routerLink="ecoles">Écoles</button>
              <button mat-menu-item routerLink="certifications">Certifications</button>
              <button mat-menu-item routerLink="collaborateurs">Collaborateurs</button>
          </mat-menu>
      </div>

  </div>
</div>
