<mat-form-field appearance="outline">
  <input matInput (keyup)="filtrerTable($event.target.value)" placeholder="Recherche rapide">
  <mat-icon matSuffix >search</mat-icon>
</mat-form-field>

<table mat-table [dataSource]="listeCertifications" matSort>

  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID.Certification</th>
    <td mat-cell *matCellDef="let element">{{element.id}}</td>
  </ng-container>

  <ng-container matColumnDef="nomCertification">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Nom de la certification</th>
    <td mat-cell *matCellDef="let element" width="85%">
      <a class="pointer"  (click)="openDialogShowCertification(element.id, element.nomCertification, element.descriptionDetaillee)" matTooltip="Voir les détails">
          {{element.nomCertification  | titlecase}}
      </a>
    </td>
  </ng-container>

  <ng-container matColumnDef="more">
      <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
      <td mat-cell *matCellDef="let element" class="pointer" width="5%">
        <a mat-button [matMenuTriggerFor]="menuCertifications" matTooltip="Plus d'options"><mat-icon>more_vert</mat-icon></a>
          <mat-menu #menuCertifications="matMenu">
            <button mat-menu-item (click)="openDialogEditCertification(element.id, element.nomCertification, element.descriptionDetaillee)" matTooltip="Modifier la certification" matTooltipPosition="right">Modifier la certification</button>
            
            <button mat-menu-item (click)="openDialogDeleteCertification(element.id)" matTooltip="Supprimer la certification" matTooltipPosition="right">Supprimer la certification</button>
          </mat-menu>
      </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
