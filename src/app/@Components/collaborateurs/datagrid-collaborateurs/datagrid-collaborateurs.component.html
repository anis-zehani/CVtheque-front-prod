<div fxFlex="100%">
  
  <mat-form-field appearance="outline">
      <input matInput (keyup)="filtrerTable($event.target.value)" placeholder="Recherche rapide">
      <mat-icon matSuffix >search</mat-icon>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2" matSort>
    
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let element">{{element.id}}</td>
      </ng-container>

      <ng-container matColumnDef="identite">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Collaborateur</th>
        <td mat-cell *matCellDef="let element" width="25%">{{element.identite}}</td>
      </ng-container>

      <ng-container matColumnDef="email">
          <th fxHide.lt-md="true" mat-header-cell *matHeaderCellDef mat-sort-header>Adresse email</th>
          <td fxHide.lt-md="true" mat-cell *matCellDef="let element" width="50%">{{element.email}}</td>
        </ng-container>

      <ng-container matColumnDef="login">
        <th fxHide.lt-md="true" mat-header-cell *matHeaderCellDef mat-sort-header>Nom d'utilisateur</th>
        <td fxHide.lt-md="true" mat-cell *matCellDef="let element" width="10%">{{element.login}}</td>
      </ng-container>

      <ng-container matColumnDef="password">
        <th fxHide.lt-md="true" mat-header-cell *matHeaderCellDef mat-sort-header>Mot de passe</th>
        <td fxHide.lt-md="true" mat-cell *matCellDef="let element" width="10%">{{element.password}}</td>
      </ng-container>

      <ng-container matColumnDef="more">
          <th mat-header-cell *matHeaderCellDef mat-sort-header></th>
          <td mat-cell *matCellDef="let element" class="pointer" width="5%">
            <a mat-button [matMenuTriggerFor]="menuCollaborateurs" matTooltip="Plus d'options"><mat-icon>more_vert</mat-icon></a>
              <mat-menu #menuCollaborateurs="matMenu">
                <button mat-menu-item (click)="openDialogEditCollaborateur(element.id, element.identite, element.email, element.login, element.password)" matTooltip="Modifier le collaborateur" matTooltipPosition="right">Modifier le collaborateur</button>
               
                <button mat-menu-item (click)="openDialogDeleteCollaborateur(element.id)" matTooltip="Suprimer le collaborateur" matTooltipPosition="right">Supprimer le collaborateur</button>
              </mat-menu>
          </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

    <mat-paginator [pageSizeOptions]="[10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
</div>
