<div class="title" style="margin-bottom: 20px; font-weight: 700;">
    Statistiques des Technologies :
</div>

<!--Grands écrans : Technologies Stats-->
<div fxLayout="row" fxLayoutAlign="space-between start" fxHide.lt-md="true"> 
    <div fxFlex="50%">
        <app-stats-technologies></app-stats-technologies>
    </div>
    <div fxFlex="50%">
        <app-datagrid-technologies></app-datagrid-technologies>
    </div>
</div>

<!--Petits écrans : Technologies Stats-->
<div fxLayout="column" fxLayoutAlign="start stretch" fxHide.gt-sm="true"> 
    <app-stats-technologies></app-stats-technologies>
    <app-datagrid-technologies></app-datagrid-technologies>
</div>

<mat-divider style="margin-bottom: 20px; margin-top: 20px;"></mat-divider>

<div class="title" style="margin-bottom: 20px; font-weight: 700;">
    Statistiques des Entreprises :
</div>

<!--Grands écrans : Entreprises Stats-->
<div fxLayout="row" fxLayoutAlign="space-between start" fxHide.lt-md="true"> 
    
    <div fxFlex="50%">
        <app-stats-entreprises></app-stats-entreprises>
    </div>

    <div fxFlex="50%">
        <app-datagrid-entreprises></app-datagrid-entreprises>
    </div>
</div>

<!--Petits écrans : Entreprises Stats-->
<div fxLayout="column" fxLayoutAlign="start stretch" fxHide.gt-sm="true"> 
    <app-stats-entreprises></app-stats-entreprises>
    <app-datagrid-entreprises></app-datagrid-entreprises>
</div>

<!--Stats Générales-->
<div *ngIf="role === 'Administrateur'" style="margin-bottom: 20px">
    <mat-divider style="margin-bottom: 20px; margin-top: 20px;"></mat-divider>
    <div class="title" style="font-weight: 700;">
        Chiffres clés :
    </div>
    <!--Grands écrans-->
    <div fxLayout="row" fxLayoutAlign="space-between start" fxHide.lt-md="true">  
        <div fxFlex="50%">
            <app-stats-generales></app-stats-generales>
        </div>
    </div>
    <!--Petits écrans-->
    <div fxLayout="column" fxLayoutAlign="start stretch" fxHide.gt-sm="true">  
        <div>
            <app-stats-generales></app-stats-generales>
        </div>
    </div>
</div>
