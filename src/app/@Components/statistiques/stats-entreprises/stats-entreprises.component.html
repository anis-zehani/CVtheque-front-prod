<div class="chart">
      <canvas baseChart
        [data]="pieChartData"
        [labels]="pieChartLabels"
        [chartType]="pieChartType"
        [options]="pieChartOptions"
        [plugins]="pieChartPlugins"
        [colors]="pieChartColors"
        [legend]="pieChartLegend">
      </canvas>
</div>
<!-- Visible sur BIG SCREENS -->
<div fxLayout="row" fxLayoutAlign="space-between stretch" style="margin-top: 30px" fxHide.lt-md="true"> 
  <button mat-flat-button (click)="entrepriseVsCandidats()" style="width:auto; margin-right: 10px; font-weight: 600;min-width: 30%;">Candidats liés</button>
  <button mat-flat-button (click)="entrepriseVsPartenaires()" style="width:auto; margin-right: 10px; font-weight: 600;min-width: 30%;">Partenaires liés</button>
</div>

<!-- Visible sur SMALL SCREENS -->
<div fxLayout="column" fxLayoutAlign="space-between stretch" style="margin-top: 30px" fxHide.gt-sm="true"> 
    <button mat-flat-button (click)="entrepriseVsCandidats()" style="font-weight: 600;">Candidats liés</button>
    <button mat-flat-button (click)="entrepriseVsPartenaires()" style="margin-top: 10px; margin-bottom: 10px;font-weight: 600;">Partenaires liés</button>
</div>
